# Node Counts the installer will expect
control_plane_replicas: 1
app_node_replicas: 0

# OCP 5.x notes:
# - RHCOS 10 (RHEL 10 based) is the default OS for fresh OCP 5 installs
# - Requires x86-64-v3 or newer CPU (older CPUs not supported by RHCOS 10)
# - Container runtime: crun (runc deprecated in RHCOS 10)

# nodes defines the nodes to use for the cluster
nodes:
  - hostname: sno-50
    rootDeviceHints:
      deviceName: /dev/sda
    interfaces:
      - name: ens192
        mac_address: "00:50:56:9a:56:78"
    networkConfig:
      interfaces:
        - name: ens192.1924
          type: vlan
          state: up
          vlan:
            id: 1924
            base-iface: ens192
          ipv4:
            enabled: true
            address:
              - ip: 192.168.50.60
                prefix-length: 24
            dhcp: false
        - name: ens192
          type: ethernet
          state: up
          mac-address: "00:50:56:9a:56:78"
      dns-resolver:
        config:
          server:
            - 192.168.50.1
      routes:
        config:
          - destination: 0.0.0.0/0
            next-hop-address: 192.168.50.1
            next-hop-interface: ens192.1924
            table-id: 254
